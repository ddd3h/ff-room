name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wheel:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.compiler || 'default' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        compiler: [gcc]
        include:
          - os: ubuntu-24.04
            python: '3.15'
            compiler: clang
          - os: macos-latest
            python: '3.15'
          - os: windows-latest
            python: '3.15'
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Select Clang
        if: matrix.compiler == 'clang'
        run: |
          echo 'CC=clang' >> "$GITHUB_ENV"
          echo 'CXX=clang++' >> "$GITHUB_ENV"
      - name: Select GCC
        if: matrix.compiler == 'gcc'
        run: |
          echo 'CC=gcc' >> "$GITHUB_ENV"
          echo 'CXX=g++' >> "$GITHUB_ENV"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel and test dependencies
        run: python -m pip install dist/*.whl pytest
      - name: Test installed package and extension
        run: python -m pytest -v
